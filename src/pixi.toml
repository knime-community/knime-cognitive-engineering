[workspace]
channels = ["knime/label/nightly", "knime", "conda-forge"]
name = "cognitive-engineering-knime"
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]
version = "0.2.0"

[dependencies]
python = "3.13.*"
knime-extension = "5.13.*"
knime-python-versions = "5.13.*"
pandas = "*"

[pypi-dependencies]
euleris = ">=0.2.0"
graphcoherence = ">=0.1.0"

[feature.build.dependencies]
python = "3.13.*"
knime-extension-bundling = "6.1.*"

[feature.build.tasks]
build = { args = [
    { "arg" = "dest", "default" = "./local-update-site" },
], cmd = "build-python-extension . {{ dest }} --update-sites-version nightly" }

[environments]
build = { features = ["build"], no-default-feature = true }
