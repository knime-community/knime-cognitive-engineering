# Conda environment for local KNIME 5.12 development of the Cognitive
# Engineering nodes. knime-python-base and knime-extension are ONLY on the
# `knime` conda channel (not PyPI); euleris/graphcoherence are PyPI-only, so
# they go in the pip section.
#
# Create:  conda env create -f env.yml
# (or with mamba/miniforge:  mamba env create -f env.yml)
#
# If the pinned 5.12 build can't be resolved, drop the "=5.12" pins and let
# conda pick the newest — then re-pin to whatever matches your KNIME version.
name: cognitive-engineering-knime
channels:
  - knime
  - conda-forge
dependencies:
  - python=3.11          # KNIME 5.x bundles Python 3.11 — do NOT use 3.13 here
  - knime-python-base=5.12
  - knime-extension=5.12
  - pandas
  - pip
  - pip:
      - euleris>=0.1.0
      - graphcoherence>=0.1.0
