[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-engineering-knime-nodes"
version = "0.1.0"
description = "KNIME Pure-Python node extensions for Euleris and GraphCoherence."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "David Martin Venti" }]
dependencies = [
    "euleris>=0.1.0",
    "graphcoherence>=0.1.0",
    "pandas>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
